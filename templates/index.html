<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0c1b 0%, #151833 50%, #0b0d19 100%);
            --glass-bg: rgba(22, 27, 54, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --accent-purple: #7000ff;
            --accent-blue: #00d2ff;
            --accent-gold: #ffd700;
            --text-main: #f0f3ff;
            --text-muted: #8e99bc;
            --user-msg-bg: linear-gradient(135deg, #7000ff 0%, #4a00e0 100%);
            --bot-msg-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 20px 30px;
            background: rgba(10, 12, 27, 0.4);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), #4a00e0);
            color: #fff;
            box-shadow: 0 2px 10px rgba(112, 0, 255, 0.3);
        }

        /* Chat Output Window */
        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out forwards;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.2);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(8px);
        }

        .message.system-info {
            align-self: center;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Loading Indicator */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 18px;
            background: var(--bot-msg-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            width: fit-content;
            align-self: flex-start;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Input Controls */
        .chat-input-area {
            padding: 20px 30px;
            background: rgba(10, 12, 27, 0.4);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(112, 0, 255, 0.3);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3);
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="brand">
                <div class="brand-icon">G</div>
                <div class="brand-title">AI & RAG Assistant </div>
            </div>
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-basic" onclick="setMode('basic')">Basic Chat</button>
                <button class="mode-btn" id="btn-rag" onclick="setMode('rag')">RAG Chat</button>
            </div>
        </div>

        <!-- Chat Output -->
        <div class="chat-messages" id="chat-messages">
            <div class="message system-info" id="mode-info">
                Mode: Basic Chat (Conversational)
            </div>
        </div>

        <!-- Input Bar -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Type your message..." onkeydown="handleKeyPress(event)" />
            </div>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentMode = 'basic';
        let chatHistory = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-basic').classList.toggle('active', mode === 'basic');
            document.getElementById('btn-rag').classList.toggle('active', mode === 'rag');
            
            const infoBanner = document.getElementById('mode-info');
            infoBanner.innerText = mode === 'basic' 
                ? 'Mode: Basic Chat (Conversational)' 
                : 'Mode: RAG Chat (Document Knowledge Base)';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chat-messages');
            const sendBtn = document.getElementById('send-btn');

            appendMessage('user', message);
            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            const typingIndicator = createTypingIndicator();
            chatMessages.appendChild(typingIndicator);
            scrollToBottom();

            try {
                // Hitting the updated /chat route
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: currentMode,
                        message: message,
                        history: chatHistory
                    })
                });

                const data = await response.json();
                typingIndicator.remove();

                if (response.ok) {
                    appendMessage('bot', data.reply);
                    
                    if (currentMode === 'basic') {
                        chatHistory.push({ role: 'user', content: message });
                        chatHistory.push({ role: 'assistant', content: data.reply });
                    }
                } else {
                    appendMessage('bot', 'Error: ' + (data.detail || 'Failed to generate response.'));
                }
            } catch (err) {
                typingIndicator.remove();
                appendMessage('bot', 'Error: Unable to connect to backend endpoint.');
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                scrollToBottom();
            }
        }

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        function createTypingIndicator() {
            const div = document.createElement('div');
            div.classList.add('typing-indicator');
            div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            return div;
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
